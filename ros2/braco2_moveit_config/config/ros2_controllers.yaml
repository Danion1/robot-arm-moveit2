# ARQUIVO GERADO por cad/gerar_moveit_config.py: CÓPIA de
# braco2_description/config/controladores.yaml (Daniel). Mudar lá e gerar de novo.
controller_manager:
  ros__parameters:
    update_rate: 100 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    braco_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    garra_controller:
      type: joint_trajectory_controller/JointTrajectoryController

braco_controller:
  ros__parameters:
    joints:
      - junta_base
      - junta_ombro
      - junta_cotovelo
      - junta_punho
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

garra_controller:
  ros__parameters:
    joints:
      - junta_garra
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
